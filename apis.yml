name: Sensome
description: 'Sensome is a clinical-stage medical technology company developing tissue-sensing
  microchip technology and proprietary integration processes that embed real-time bio-impedance
  sensing into minimally invasive medical devices. Its lead product, the Clotild Smart Guidewire
  System (manufactured with Asahi Intecc), is the first tissue-sensing neurovascular guidewire,
  providing physicians real-time blood clot characterization to guide Acute Ischemic Stroke
  treatment; additional indications include lung cancer biopsy guidance. Surfaced as a portfolio
  company of Partech, Sensome is a medical-device hardware company with no public API, SDK, or
  developer platform at the time of enrichment.'
